client_max_body_size 100M;

location /media {
  alias /usr/src/app/media;
}

location /static {
  alias /usr/src/app/staticfiles;
}

location / {
  try_files /dev/null @django_app;
}

location ~\.sqlite3$ {
  deny all;
  error_page 403 =404 /;
}

location ~ /\.well-known {
  allow all;
}

server {
  listen 80;
  server_name bayanebartar.ieltsways.com;

  location / {
    return 301 http://app.studyways.ir/landing/109;
  }
}